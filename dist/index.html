<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1226" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Practise Danish grammar with short quizzes at three levels: verbs, adverbs, adjectives, pronouns, prepositions, word order, telling the time and writing.">
  <title>Danish Grammar Trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232347b5'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='34' fill='white'%3E%C3%86%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" aria-label="Danish Grammar Trainer, go to the start page">
        <span class="brand-mark" aria-hidden="true">Æ</span>
        <span class="brand-name">Danish Grammar Trainer</span>
      </button>
      <div class="top-stats" aria-label="Your progress">
        <span class="top-stat"><strong id="totalPoints">0</strong> points</span>
        <span class="top-stat top-stat-streak">Best streak: <strong id="bestStreak">0</strong></span>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <div class="sr-only" aria-live="polite" id="liveRegion"></div>

  <!-- Interface language: swap i18n-en.js for i18n-it.js to change it. -->
  <script src="js/i18n-en.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/writing-data.js"></script>
  <script src="js/writing-score.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
